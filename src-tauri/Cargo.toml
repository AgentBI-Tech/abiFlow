[package]
name = "abi-flow"
version = "0.1.0"
description = "abiFlow - human-AI collaboration desktop workbench for e-commerce operations"
authors = ["abiFlow"]
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.77.2"

[lib]
name = "abi_flow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# bundled 自带 SQLite 源码编译，避免各平台系统库版本差异；只对 v0.1 建表够用。
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = "2"
chrono = { version = "0.4.45", features = ["clock"] }
# 用户密码 salted hash（存 users 表，明文不落盘/不进日志）。
sha2 = "0.10"
getrandom = "0.3"
# 启动时从 <app_data_dir>/abiflow/llm.env 加载 LLM 配置；密钥只从 env 读、不进 config.json/代码。
dotenvy = "0.15"

[dev-dependencies]
tempfile = "3"
